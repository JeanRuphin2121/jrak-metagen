# =============================================================
# Metagen CI Pipeline
#
# Triggers:
#   - Every push to main / develop
#   - Every pull request targeting main
#
# Jobs:
#   build  — compile + unit tests
#   test   — integration tests (Testcontainers + PostgreSQL)
#   docker — build & push Docker image (main branch only)
# =============================================================

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/metagen-server

jobs:

  # ── Build & Unit Tests ──────────────────────────────────────
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -q

      - name: Unit Tests
        run: mvn test -pl metagen-core,metagen-engine --no-transfer-progress

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"


  # ── Integration Tests ───────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      # Testcontainers manages its own PostgreSQL instance,
      # but we keep this here in case future tests need a shared DB.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       metagen_test
          POSTGRES_USER:     metagen
          POSTGRES_PASSWORD: metagen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Integration Tests
        run: mvn verify -pl metagen-server --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          METAGEN_DB_URL:         jdbc:postgresql://localhost:5432/metagen_test
          METAGEN_DB_USER:        metagen
          METAGEN_DB_PASSWORD:    metagen
          METAGEN_JWT_SECRET:     test-secret-do-not-use-in-production-min32

      - name: Upload Failsafe Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/**"


  # ── Docker Build & Push (main only) ─────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ build, integration-test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
