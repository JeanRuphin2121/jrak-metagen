# =============================================================
# Metagen — Development environment
#
# Starts only the infrastructure services (PostgreSQL + pgAdmin).
# The Spring Boot app runs locally via:
#   ./mvnw spring-boot:run -pl metagen-server -Pdev
#
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml down -v   # wipe data
# =============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: metagen-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       metagen
      POSTGRES_USER:     metagen
      POSTGRES_PASSWORD: metagen
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metagen -d metagen"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metagen-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@metagen.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  pgadmin_dev_data:
